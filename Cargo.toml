[workspace]
resolver = "2"
members = ["core", "native-host", "desktop-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Keytap contributors"]
publish = false

[workspace.dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
rqrr = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
